<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hitas_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- 🎨 Couleur du thème pour la barre de statut du navigateur/téléphone -->
    <meta name="theme-color" content="#030014" />
    
    <!-- 📱 Lien vers le manifeste PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🍏 Recommandé pour l'icône sur iOS -->
    <link rel="apple-touch-icon" href="/logo192.png" />

    <title>Communauté HITAS Connect</title>

    <!-- 🌐 Styles to make Google Translate look good in dark mode -->
    <style>
      /* Google Translate is used only as a translation engine.
         Its visual interface is completely hidden. */
    
      #google_translate_element {
        width: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    
      .goog-te-gadget {
        font-size: 0 !important;
        height: 0 !important;
        overflow: hidden !important;
      }
    
      .goog-te-gadget span {
        display: none !important;
      }
    
      .goog-te-combo {
        display: none !important;
      }
    
      .goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
      }
    
      body {
        top: 0 !important;
      }
    
      html {
        margin-top: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
