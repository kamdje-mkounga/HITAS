<!doctype html>
<html lang="fr"> <!-- 🌐 Changé en 'fr' pour que Google sache que le site est en français à la base -->
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hitas_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>communauté HITAS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- 🌐 SCRIPT GOOGLE TRADUCTION AUTOMATIQUE -->
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'fr', // Langue source
          includedLanguages: 'en,fr,es,de,hi,pt', // Langues cibles disponibles (Anglais, Français, Espagnol, Allemand, Hindi, Portugais)
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  </body>
</html>
