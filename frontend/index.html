<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/hitas_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- 🎨 Couleur du thème pour la barre de statut du navigateur/téléphone -->
    <meta name="theme-color" content="#030014" />
    
    <!-- 📱 Lien vers le manifeste PWA -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- 🍏 Recommandé pour l'icône sur iOS -->
    <link rel="apple-touch-icon" href="/logo192.png" />

    <title>Communauté HITAS Connect</title>

    <!-- 🌐 Styles to make Google Translate look good in dark mode -->
    <style>
      /* =========================================================
         GOOGLE TRANSLATE — HIDE GOOGLE UI, KEEP TRANSLATION
         ========================================================= */
    
      /* Hide Google's top translation banner */
      body > .skiptranslate {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
      }
    
      iframe.goog-te-banner-frame,
      .goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        width: 0 !important;
      }
    
      /* Google moves the entire page down when the banner appears */
      html,
      body {
        margin-top: 0 !important;
        top: 0 !important;
      }
    
      body {
        position: static !important;
      }
    
      /* =========================================================
         HIDDEN GOOGLE TRANSLATE ENGINE
         ========================================================= */
    
      #google_translate_element {
        position: absolute !important;
        left: -9999px !important;
        top: -9999px !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    
      .goog-te-gadget {
        font-size: 0 !important;
      }
    
      .goog-te-gadget span {
        display: none !important;
      }
    
      .goog-te-combo {
        width: 1px !important;
        height: 1px !important;
        opacity: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    
      /* Hide Google branding inside our hidden widget */
      .goog-logo-link {
        display: none !important;
      }
    
      .goog-te-gadget-icon {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
